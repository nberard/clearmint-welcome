<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Agenda</title>
<link rel="stylesheet" href="hud.css">
<style>
  .card { height: 100%; display: flex; flex-direction: column; gap: 8px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .week { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; min-height: 0; }
  .day { display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow: hidden;
         border-top: 1px solid var(--hud-faint); padding-top: 4px; }
  .day h3 { font-size: clamp(10px, 2.6vh, 14px); font-weight: normal; letter-spacing: .12em;
            display: flex; align-items: baseline; gap: .4em; color: var(--hud-dim); }
  .day h3 b { color: var(--hud); font-size: 1.25em; }
  .day.today { border-top: 2px solid var(--hud); background: rgba(62, 242, 255, .07);
               box-shadow: inset 0 0 18px rgba(62, 242, 255, .08); }
  .day.today h3, .day.today h3 b { color: var(--hud); }
  .day.past h3 { opacity: .55; }
  .day.weekend h3 { color: var(--accent); }
  /* Couleurs de Google Agenda, translucides : bleu « Paon » pour les événements,
     orange « Mandarine » pour les tâches et rappels (événements sans durée). */
  .ev { font-size: clamp(11px, 2.8vh, 15px); line-height: 1.3; padding: 4px 6px; border-radius: 4px;
        border-left: 4px solid #039be5; background: rgba(3, 155, 229, .30);
        color: #f2fbff; text-shadow: none; }
  .ev .t { color: #8fd8ff; font-weight: bold; margin-right: .4em; }
  .ev .loc { display: block; color: rgba(242, 251, 255, .65); font-size: .85em; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .ev.allday { background: rgba(3, 155, 229, .50); }
  .ev.task { border-left-color: #f4511e; background: rgba(244, 81, 30, .30); }
  .ev.task .t { color: #ffb08f; }
  .ev.task .t::before { content: "✓ "; }
  /* Agendas suivants (calendar?ics=A&ics=B…) : Sauge, Raisin, Flamant rose */
  .ev.c1 { border-left-color: #33b679; background: rgba(51, 182, 121, .30); }
  .ev.c1.allday { background: rgba(51, 182, 121, .48); }
  .ev.c2 { border-left-color: #8e24aa; background: rgba(142, 36, 170, .35); }
  .ev.c3 { border-left-color: #e67c73; background: rgba(230, 124, 115, .32); }
  .ev.now { box-shadow: 0 0 0 1px #73bf69, 0 0 12px rgba(115, 191, 105, .55); }
  .ev.done { opacity: .55; }
  .empty { color: var(--hud-faint); font-size: 12px; text-align: center; margin-top: 6px; }
  .msg { color: var(--warn); font-size: 12px; }
</style>
</head>
<body>
  <section class="card">
    <div class="head"><span class="label" id="title">AGENDA</span><span class="label" id="status"></span></div>
    <div class="week" id="week"></div>
  </section>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
let data = null;

function rgba(hex, a) {                      // "#039be5" -> "rgba(3,155,229,a)"
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${a})`;
}

function weekNumber(d) {                       // numéro de semaine ISO
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}

function render() {
  if (!data) return;
  if (data.error && !data.events.length) {
    $("week").innerHTML = `<span class="msg" style="grid-column:1/-1">${esc(data.error)}</span>`;
    return;
  }
  const monday = new Date(data.start), now = new Date(), today = ymd(now);
  const days = [...Array(7)].map((_, i) => new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
  const fmt = (d, o) => d.toLocaleDateString("fr-FR", o);
  const rolling = new URLSearchParams(location.search).get("from") === "today";
  $("title").textContent = `${rolling ? "7 PROCHAINS JOURS" : "SEMAINE " + weekNumber(monday)} · ` +
                           `${fmt(days[0], { day: "numeric", month: "short" })} – ` +
                           `${fmt(days[6], { day: "numeric", month: "short" })}`.toUpperCase();
  $("status").textContent = data.stale ? "hors ligne" : (data.errors || []).length ? "⚠ " + data.errors[0] : "";

  $("week").innerHTML = days.map((d, i) => {
    const key = ymd(d);
    const evs = data.events.filter((e) => e.all_day
      ? e.start <= key && key < e.end                    // sur plusieurs jours
      : e.start.slice(0, 10) === key);
    const cls = ["day", key === today ? "today" : "", key < today ? "past" : "", [0, 6].includes(d.getDay()) ? "weekend" : ""].join(" ");
    const items = evs.map((e) => {
      const cal = e.cal ? ` c${e.cal % 4}` : "";
      // Couleur réelle de Google Agenda (API) : bordure pleine, fond translucide.
      const style = e.color ? ` style="border-left-color:${e.color};background:${rgba(e.color, e.all_day ? .45 : .30)}"` : "";
      if (e.all_day) {
        const t = e.task ? " task" + (e.done ? " done" : "") : "";
        return `<div class="ev allday${cal}${t}"${style}>${e.task ? "✓ " : ""}${esc(e.title)}</div>`;
      }
      const s = new Date(e.start), en = new Date(e.end);
      const task = en - s === 0;                     // sans durée : tâche ou rappel
      const state = (task ? now >= s : now >= s && now < en) ? (task ? "done" : "now") : now >= en ? "done" : "";
      const loc = e.location ? `<span class="loc">${esc(e.location.split(",")[0])}</span>` : "";
      return `<div class="ev ${state}${cal}${task ? " task" : ""}"${style}><span class="t">${pad(s.getHours())}:${pad(s.getMinutes())}</span>` +
             `${esc(e.title)}${loc}</div>`;
    }).join("") || '<span class="empty">—</span>';
    return `<div class="${cls}"><h3>${fmt(d, { weekday: "short" }).replace(".", "").toUpperCase()}` +
           `<b>${d.getDate()}</b></h3>${items}</div>`;
  }).join("");
}

async function load() {
  try {
    data = await (await fetch("/api/calendar" + location.search, { cache: "no-store" })).json();
    document.body.classList.remove("offline");
  } catch (e) {
    document.body.classList.add("offline");
  }
  render();
}
load();
setInterval(load, 5 * 60 * 1000);
setInterval(render, 60 * 1000);   // « en cours » / « terminé » au fil de la journée
</script>
</body>
</html>
