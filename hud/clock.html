<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Clock</title>
<link rel="stylesheet" href="hud.css">
<style>
  .card { height: 100%; display: flex; align-items: center; gap: 2vw; }
  .time { font-size: clamp(36px, 42vh, 150px); font-weight: bold; line-height: 1; letter-spacing: .02em; }
  .time small { font-size: .35em; color: var(--hud-dim); margin-left: .15em; }
  .left { display: flex; flex-direction: column; gap: 1vh; }
  .date { font-size: clamp(12px, 9vh, 26px); text-transform: capitalize; }
  .hello { font-size: clamp(10px, 6vh, 16px); color: var(--accent); text-shadow: 0 0 6px rgba(184,119,217,.6); }
  /* Bloc système : prend toute la place restante, valeurs sur une ligne. */
  .info { flex: 1; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr);
          gap: .5vh 1em; font-size: clamp(11px, 7.5vh, 17px); align-self: center;
          padding-left: 1.2vw; border-left: 1px solid var(--hud-faint); }
  .info span:nth-child(odd) { color: var(--hud-dim); letter-spacing: .15em; font-size: .72em; align-self: center;
                              white-space: nowrap; }
  .info b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal { margin: 0; flex: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: .15vh .3vw;
         font-size: clamp(9px, 5.5vh, 13px); text-align: center; align-self: center; }
  .cal .title { grid-column: 1 / -1; letter-spacing: .2em; color: var(--hud-dim); font-size: .85em;
                text-transform: uppercase; margin-bottom: .2vh; }
  .cal .dow { color: var(--hud-dim); font-size: .8em; }
  .cal span { padding: .08em .2em; }
  .cal .other { opacity: .25; }
  .cal .we { color: var(--accent); text-shadow: 0 0 6px rgba(184,119,217,.5); }
  .cal .today { background: var(--hud); color: #03070c; text-shadow: none; box-shadow: 0 0 10px var(--hud); }
  .battery { display: inline-flex; align-items: center; gap: .5em; }
  .battery svg { height: 1.3em; width: auto; overflow: visible; filter: drop-shadow(0 0 3px currentColor); }
</style>
</head>
<body>
  <section class="card">
    <div class="left">
      <div class="hello" id="hello"></div>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="cal" id="cal"></div>
    <div class="info">
      <span>SYSTÈME</span><b id="distro">—</b>
      <span>MACHINE</span><b id="host">—</b>
      <span>EN MARCHE</span><b id="uptime">—</b>
      <span>CHARGE</span><b id="load">—</b>
      <span id="bat-label">BATTERIE</span><b id="bat">—</b>
      <span>IP LOCALE</span><b id="lip">—</b>
      <span>IP PUBLIQUE</span><b id="pip">—</b>
    </div>
  </section>
<script>
const $ = (id) => document.getElementById(id);
const name = new URLSearchParams(location.search).get("name");
const pad = (n) => String(n).padStart(2, "0");

function greeting(h) {
  const g = h < 5 ? "Bonne nuit" : h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : h < 22 ? "Bonsoir" : "Bonne nuit";
  return name ? `${g}, ${name}` : g;
}
function clock() {
  const d = new Date();
  $("time").innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}<small>${pad(d.getSeconds())}</small>`;
  $("date").textContent = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("hello").textContent = greeting(d.getHours());
  calendar(d);
}
// Calendrier du mois, semaine commençant le lundi, aujourd'hui en surbrillance.
let calDay = null;
function calendar(d) {
  if (calDay === d.toDateString()) return;
  calDay = d.toDateString();
  const y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1), start = (first.getDay() + 6) % 7;
  const cells = [`<span class="title">${d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })}</span>`];
  for (const l of ["L", "M", "M", "J", "V", "S", "D"]) cells.push(`<span class="dow">${l}</span>`);
  for (let i = 0; i < 42; i++) {
    const day = new Date(y, m, 1 - start + i);
    if (i >= 35 && day.getMonth() !== m) break;      // pas de 6e ligne vide
    const cls = [day.getMonth() !== m ? "other" : "", i % 7 >= 5 ? "we" : "",
                 day.toDateString() === calDay ? "today" : ""].join(" ");
    cells.push(`<span class="${cls}">${day.getDate()}</span>`);
  }
  $("cal").innerHTML = cells.join("");
}
function duration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d} j ${h} h` : h ? `${h} h ${pad(m)}` : `${m} min`;
}
// Pile dessinée : niveau de remplissage, couleur selon la charge, éclair si branchée.
function batteryIcon(pct, charging) {
  const w = Math.max(1.5, 30 * Math.min(100, pct) / 100);
  const color = pct <= 10 ? "var(--hot)" : pct <= 25 ? "var(--warn)" : "currentColor";
  const bolt = charging
    ? '<path d="M19 3 L13 11 H17 L15 17 L22 8 H18 Z" fill="#03070c" stroke="currentColor" stroke-width=".8" stroke-linejoin="round"/>'
    : "";
  return `<svg viewBox="0 0 40 20" aria-hidden="true">
    <rect x="1" y="1" width="34" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <rect x="36" y="6" width="3" height="8" rx="1" fill="currentColor"/>
    <rect x="3" y="3" width="${w}" height="14" rx="1.5" fill="${color}" opacity=".85"/>
    ${bolt}</svg>`;
}

async function system() {
  try {
    const s = (await (await fetch("/api/stats", { cache: "no-store" })).json()).system;
    if (!s) return;
    document.body.classList.remove("offline");
    $("distro").textContent = s.distro || "Linux";
    $("host").textContent = s.host;
    $("uptime").textContent = duration(s.uptime);
    $("load").textContent = s.load.join("  ");
    $("lip").innerHTML = s.local_ip
      ? `${s.local_ip}${s.iface ? ` <span class="dim">${s.iface}</span>` : ""}` : "hors ligne";
    $("pip").textContent = s.public_ip || (s.local_ip ? "…" : "hors ligne");
    if (s.battery) {
      const b = s.battery;
      const charging = /charg/i.test(b.status) && !/dis/i.test(b.status);
      const full = /full/i.test(b.status) || b.percent >= 100;
      $("bat").innerHTML = batteryIcon(b.percent, charging) +
        `<span>${b.percent}%${charging ? " · en charge" : full ? " · pleine" : ""}</span>`;
      $("bat").className = "battery " + (b.percent <= 10 ? "hot" : b.percent <= 25 ? "warn" : "");
    } else {
      $("bat").style.display = $("bat-label").style.display = "none";
    }
  } catch (e) {
    document.body.classList.add("offline");
  }
}
clock(); system();
setInterval(clock, 1000);
setInterval(system, 5000);
</script>
</body>
</html>
