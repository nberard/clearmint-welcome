<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Grid</title>
<style>
  /* Fond opaque animé : à mettre en premier calque. Animations légères (transform uniquement). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03070c; }
  .glow {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 30% 45%, rgba(20, 90, 120, .28), transparent 70%),
      radial-gradient(ellipse 50% 40% at 85% 85%, rgba(110, 40, 150, .18), transparent 70%);
  }
  .grid {               /* quadrillage qui défile lentement */
    position: fixed; left: 0; right: 0; top: -60px; bottom: 0;
    background-image:
      linear-gradient(rgba(62, 242, 255, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62, 242, 255, .06) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: drift 12s linear infinite;
    will-change: transform;
  }
  @keyframes drift { to { transform: translateY(60px); } }
  .floor {              /* sol en perspective, en bas */
    position: fixed; left: -50%; right: -50%; bottom: -10%; height: 55%;
    background-image:
      linear-gradient(rgba(62, 242, 255, .16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62, 242, 255, .16) 1px, transparent 1px);
    background-size: 80px 80px;
    transform: perspective(500px) rotateX(62deg);
    transform-origin: 50% 0;
    mask-image: linear-gradient(to bottom, transparent, black 70%);
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 70%);
  }
  .scan {               /* ligne de balayage */
    position: fixed; left: 0; right: 0; height: 120px; top: -120px;
    background: linear-gradient(to bottom, transparent, rgba(62, 242, 255, .05), transparent);
    animation: scan 9s linear infinite;
    will-change: transform;
  }
  @keyframes scan { to { transform: translateY(calc(100vh + 120px)); } }
  .vignette { position: fixed; inset: 0; box-shadow: inset 0 0 220px 40px #000; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="floor"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
</body>
</html>
